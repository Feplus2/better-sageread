name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './packages/app/src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install

      - name: Sync version
        run: |
          node -e "const fs=require('fs');const path='packages/app/src-tauri/tauri.conf.json';const data=JSON.parse(fs.readFileSync(path));data.version='${{ github.ref_name }}'.replace(/^v/,'');data.identifier='com.bettersageread.app';fs.writeFileSync(path,JSON.stringify(data,null,2));"

      # macOS 暂缺转换器 sidecar 构建（PyInstaller 仅出了 Windows 版）：构建前从 externalBin 摘除，
      # 否则 tauri build 因找不到二进制直接失败。mac 版首版不带 PDF 转换功能，运行时转换会报错提示。
      - name: Strip converter sidecars (macOS only)
        if: matrix.platform == 'macos-latest'
        run: |
          node -e "const fs=require('fs');const path='packages/app/src-tauri/tauri.conf.json';const data=JSON.parse(fs.readFileSync(path));data.bundle.externalBin=data.bundle.externalBin.filter(b=>!b.includes('books_converter')&&!b.includes('papers_converter'));fs.writeFileSync(path,JSON.stringify(data,null,2));"

      - name: Remove existing binary signatures
        if: matrix.platform == 'macos-latest'
        run: |
          if [ -f packages/app/src-tauri/binaries/woff2_compress ]; then
            codesign --remove-signature packages/app/src-tauri/binaries/woff2_compress || true
          fi
      
      - name: Build and Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SKIP_SIDECAR_SIGNATURE_CHECK: true
        with:
          projectPath: './packages/app'
          tagName: ${{ github.ref_name }}
          releaseName: 'Better SageRead ${{ github.ref_name }}'
          releaseBody: 'See the assets to download and install this version.'
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}