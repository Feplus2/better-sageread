name: Sync release to Tencent COS

# Release 发布（含 draft 转正式）后自动把安装包同步到国内 COS 镜像，
# 官网「高速下载」按钮随即指向新版本。也可手动触发补同步历史版本。
# 需要的 Secrets：TENCENT_COS_SECRET_ID / TENCENT_COS_SECRET_KEY（CAM 子用户，仅授 COS）。

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "要同步的 Release tag（如 v0.2.1）"
        required: true

permissions:
  contents: read

jobs:
  cos-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -e
          mkdir -p assets
          gh release download "$TAG" --repo "${{ github.repository }}" --dir assets
          # 安装包本体剔除签名/更新清单/校验类小文件（官网 countable 同口径）；
          # latest.json 单独保留——它是应用内更新通道的清单（下方改写后传桶根）
          rm -f assets/*.sig assets/*.blockmap assets/*.txt
          ls -lh assets

      - name: Rewrite latest.json download URL to CDN
        env:
          CDN_BASE: "https://dl.bettersageread.cn"
          GH_BASE: "https://github.com/${{ github.repository }}/releases/download"
        run: |
          set -e
          [ -f assets/latest.json ] || { echo "no latest.json in release, skip"; exit 0; }
          # 把清单里的安装包地址从 GitHub 换成 CDN（只换 host 前缀，文件名不动）
          node -e "
            const fs = require('fs');
            const j = JSON.parse(fs.readFileSync('assets/latest.json', 'utf8'));
            for (const p of Object.values(j.platforms ?? {})) {
              if (typeof p.url === 'string') {
                p.url = p.url.replace(/^https:\/\/github\.com\/[^/]+\/[^/]+\/releases\/download\/[^/]+\//, '$CDN_BASE/');
              }
            }
            fs.writeFileSync('assets/latest.json', JSON.stringify(j, null, 2));
            console.log(JSON.stringify(j, null, 2));
          "

      # 官网数据源落桶（api.github.com 国内可达性差，站点版本号/大小/累计下载数改从 CDN 拉）
      - name: Write site-data JSON to bucket
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          PRODUCT_KEY: ${{ github.event.repository.name || github.repository }}
        run: |
          set -e
          node -e "
            const fs = require('fs');
            const rel = JSON.parse(fs.readFileSync('assets/latest.json', 'utf8'));
            const latest = {
              tag: process.env.TAG,
              assets: fs.readdirSync('assets').filter((n) => !/\.(sig|json|blockmap|txt)$/.test(n)).map((n) => {
                const st = fs.statSync('assets/' + n);
                return { name: n, size: st.size };
              }),
            };
            (async () => {
              // 累计下载数：全部 release 的可安装资产求和
              const res = await fetch('https://api.github.com/repos/${{ github.repository }}/releases?per_page=100', {
                headers: { Authorization: 'token ' + process.env.GH_TOKEN, Accept: 'application/vnd.github+json' },
              });
              const rels = await res.json();
              let cumulative = 0;
              for (const r of rels) for (const a of r.assets ?? []) {
                if (!/\.(sig|json|blockmap|txt)$/.test(a.name)) cumulative += a.download_count;
              }
              const out = { tag: latest.tag, assets: latest.assets, cumulative };
              fs.writeFileSync('assets/site-data.better-sageread.json', JSON.stringify(out, null, 2));
              console.log(JSON.stringify(out, null, 2));
            })().catch((e) => { console.error(e); process.exit(1); });
          "

      - name: Upload to Tencent COS
        env:
          TENCENT_COS_SECRET_ID: ${{ secrets.TENCENT_COS_SECRET_ID }}
          TENCENT_COS_SECRET_KEY: ${{ secrets.TENCENT_COS_SECRET_KEY }}
        run: |
          set -e
          shopt -s nullglob
          files=(assets/*)
          if [ ${#files[@]} -eq 0 ]; then echo "no binary assets, nothing to upload"; exit 0; fi
          pip install -q coscmd
          # 跨境链路调优：走 COS 全球加速端点（传输加速已对桶开启）+ 10MB 分片 +
          # 10 线程 + 分片级重试 10 次。GitHub runner→COS 跨境偶发
          # UserNetworkTooSlow（2026-08-18 实测 51 分钟被断连两次后开启加速端点）
          coscmd config -a "$TENCENT_COS_SECRET_ID" -s "$TENCENT_COS_SECRET_KEY" \
            -b sageread-dl-1444623537 \
            -e cos.accelerate.myqcloud.com \
            -m 10 -p 10 --retry 10 --timeout 120
          for f in "${files[@]}"; do
            name="$(basename "$f")"
            ok=0
            for attempt in 1 2 3; do
              echo "== upload: $name (attempt $attempt)"
              if coscmd upload "$f" "/$name"; then ok=1; break; fi
              sleep 10
            done
            if [ "$ok" != 1 ]; then echo "FAILED: $name"; exit 1; fi
          done

      # 刷新 CDN 边缘缓存：latest.json / site-data 是固定 URL 的更新清单，
      # 边缘 TTL 陈旧会让「检查更新」拿到旧版本（2026-09-06 v0.3.2 实测卡点：
      # CDN 边缘停在 0.3.1，且陈旧但合法的响应不会触发 GitHub 兜底）。
      # 失败仅告警不阻断同步；告警多半是该 CAM 子用户缺 CDN 权限。
      - name: Purge CDN edge cache for manifests
        continue-on-error: true
        env:
          TENCENT_COS_SECRET_ID: ${{ secrets.TENCENT_COS_SECRET_ID }}
          TENCENT_COS_SECRET_KEY: ${{ secrets.TENCENT_COS_SECRET_KEY }}
        run: |
          pip install -q tencentcloud-sdk-python-cdn
          python - <<'EOF'
          import os
          from tencentcloud.common import credential
          from tencentcloud.cdn.v20180606 import cdn_client, models
          cred = credential.Credential(os.environ["TENCENT_COS_SECRET_ID"],
                                       os.environ["TENCENT_COS_SECRET_KEY"])
          client = cdn_client.CdnClient(cred, "")
          urls = ["https://dl.bettersageread.cn/latest.json",
                  "https://dl.bettersageread.cn/site-data.better-sageread.json"]
          try:
              req = models.PurgeUrlsCacheRequest()
              req.Urls = urls
              resp = client.PurgeUrlsCache(req)
              print("CDN 边缘缓存刷新已提交:", resp.to_json_string())
          except Exception as e:
              print("::warning::CDN 刷新失败（多半是该 CAM 子用户尚无 CDN 权限）:", e)
              print("::warning::CAM 控制台给该子用户挂 QcloudCDNFullAccess"
                    "（或自定义策略放行 cdn:PurgeUrlsCache）后本步骤自动生效")
          EOF

      # 只保留最新版：按本仓库产品前缀限定清理范围，别动其他产品的包
      - name: Prune stale packages in COS
        env:
          TENCENT_COS_SECRET_ID: ${{ secrets.TENCENT_COS_SECRET_ID }}
          TENCENT_COS_SECRET_KEY: ${{ secrets.TENCENT_COS_SECRET_KEY }}
        run: |
          set -e
          shopt -s nullglob
          files=(assets/*)
          if [ ${#files[@]} -eq 0 ]; then exit 0; fi
          coscmd config -a "$TENCENT_COS_SECRET_ID" -s "$TENCENT_COS_SECRET_KEY" \
            -b sageread-dl-1444623537 -e cos.accelerate.myqcloud.com >/dev/null
          case "${{ github.repository }}" in
            *better-sageread) PREFIX="Better.SageRead_" ;;
            *Books_Converter) PREFIX="Books_Converter-v|books_converter-cli-v" ;;
            *) echo "unknown repo, skip prune"; exit 0 ;;
          esac
          keep="$(mktemp)"
          for f in "${files[@]}"; do basename "$f"; done | sort > "$keep"
          if [ ! -s "$keep" ]; then echo "keep list empty, abort prune"; exit 1; fi
          coscmd list | sed 's/^ *//' | cut -d' ' -f1 | grep -E "^(${PREFIX})" | while read -r obj; do
            if [ -n "$obj" ] && ! grep -qxF "$obj" "$keep"; then
              echo "prune: $obj"
              coscmd delete -f "/$obj" || true
            fi
          done
