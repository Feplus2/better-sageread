  - id: "cross-doc-interface-design"
    category: "cross-doc"
    docs:
      - "paper:a27b187c6bd02d3c"
      - "paper:09515f7218b81d7f"
    prompt: |
      比较《Rational design of layered oxide materials for sodium-ion batteries》和《Environmentally stable interface of layered oxide cathodes for sodium-ion batteries》两篇论文：它们在「钠离子层状氧化物正极设计」上的思路差异是什么？各自解决什么问题、用什么设计手段、证据是什么？
    gold:
      anchors:
        - "paper:a27b187c6bd02d3c"
        - "paper:09515f7218b81d7f"
      facts:
        - "论文 A（Rational design）关注体相堆叠结构：用阳离子势预测 P2/O3 堆叠，设计 Na-Li-Mn(Ti)-O 体系"
        - "论文 C（Environmentally stable interface）关注界面环境稳定性：表面富集 Ti 形成类尖晶石 Ti(III) 氧化物界面"
        - "两篇都针对钠离子层状氧化物（锰基层状正极）"
        - "A 的证据：阳离子势相图 + XRD/Rietveld + 电化学性能"
        - "C 的证据：SEM/XRD/SAED/EELS + 循环性能/界面稳定性"
        - "设计杠杆不同：A 是体相成分/堆叠设计，C 是表面/界面化学设计"
      must_not:
        - "把两篇的设计手段互换（说 A 用 Ti 表面富集、C 用阳离子势）"
        - "声称两篇是同一课题组或同一材料体系"
    grader:
      type: "anchor+facts+rubric"
      pass_rule: "两篇文档都命中 且 facts 命中 ≥4 且 must_not 违例 = 0"
      rubric: "两篇各自问题/手段/证据各 1 分；对比结论 1 分；混淆一票否决"
    budget: { max_steps: 16, max_tokens: 40000 }
    golden_trace:
      - tool: "searchLibrary"
        args: { query: "layered oxide cathode design strategy interface stability", scope: "all", types: ["text"], top_k: 8 }
      - tool: "readDocument"
        args: { anchor: "<A 命中锚点>", after: 4000 }
      - tool: "readDocument"
        args: { anchor: "<C 命中锚点>", after: 4000 }
    old_tool_hint: ["paperSearch（全库）", "readPaperSection 两篇"]
    notes: "两篇都已索引（84 / 140 chunks），用来测跨文献检索 + 双文档阅读；旧工具集需要切文档或开全库搜索。"

