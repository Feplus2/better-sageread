    doc: "book:9f1820c6dcc62250458da69162b72e5d"
    prompt: |
      这本书第三章主要讲了什么？用 3–5 句话概括，并告诉我章节标题。
    gold:
      anchors:
        - "book:9f1820c6dcc62250458da69162b72e5d/text/part0007.md#第三章"
      facts:
        - "第三章标题是「政治学」"
        - "围绕福柯与萨特的政治立场分歧展开（普遍型知识分子 vs 专才/批判知识分子）"
        - "讨论福柯与马克思主义、法国共产党的关系"
        - "提到 1968 年五月风暴/突尼斯时期福柯与布朗肖的传闻"
        - "福柯拒绝固定政治身份，称自己在政治棋盘每个格子里都留下脚印"
      must_not:
        - "把第三章主题说成「作者功能」或「文学」（那是第二章）"
        - "把第三章说成「疯癫」或「系谱学」"
