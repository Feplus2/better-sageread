        - "通过 MAPI/pymatgen、OPTIMADE API、AFLUX REST、Google Cloud Storage 获取结构"
        - "只用充电态（charged-only）结构构建数据集，而不是充放电对"
        - "用 ET / GB / RF / XGB 四个机器学习模型组成委员会预测电压与比容量"
        - "对排名靠前的候选做高通量第一性原理（DFT）验证：电压曲线、相稳定性、结构稳定性、电子性质"
