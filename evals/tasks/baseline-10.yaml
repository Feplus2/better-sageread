        args: { doc: "book:9f1820c6dcc62250458da69162b72e5d" }
      - tool: "readDocument"
        args: { anchor: "book:9f1820c6dcc62250458da69162b72e5d/text/part0007.md#第三章", after: 6000 }
      - tool: "readDocument"
        args: { anchor: "<上一步 next>" }
    old_tool_hint: ["ragToc", "readBookSection", "ragSearch"]
    notes: "part0007.md 共 7944 字符，需要 1–2 个窗口。"

