      type: "anchor+facts+rubric"
      pass_rule: "章节锚点命中 且 facts 命中 ≥3 且 must_not 违例 = 0"
      rubric: "章节正确 1 分；每条事实 1 分；编造/错章一票否决"
    budget: { max_steps: 12, max_tokens: 30000 }
    golden_trace:
